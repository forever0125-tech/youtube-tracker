name: YouTube Trend Auto Tracker

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'  # 정시 혼잡을 피해 매시간 17분 예약 (실행 지연 가능)
  workflow_dispatch:
    inputs:
      force:
        description: '최근 수집 여부와 관계없이 강제로 수집'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  track-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          # Read the newest snapshot after waiting for the shared concurrency lock.
          ref: main

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: 최근 수집 확인 · 중복 실행 방지
        id: freshness
        env:
          FORCE_COLLECTION: ${{ inputs.force }}
        run: |
          if [ "$FORCE_COLLECTION" = "true" ]; then
            python collection_gate.py --force
          else
            python collection_gate.py
          fi

      - name: 트래커 스크립트 실행 (금고 키 주입)
        id: tracker
        if: steps.freshness.outputs.collect == 'true'
        continue-on-error: true
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          python tracker.py

      - name: 수집된 누적 DB 및 대시보드 저장
        if: steps.tracker.outcome == 'success'
        run: |
          python - <<'PY'
          from pathlib import Path
          limit = 95 * 1024 * 1024
          files = [Path('tracker.db'), Path('index.html'), Path('dashboard.html')]
          too_large = [f for f in files if f.exists() and f.stat().st_size > limit]
          if too_large:
              raise SystemExit('저장 중단: 95MB 초과 파일 ' + ', '.join(str(f) for f in too_large))
          PY
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.db index.html dashboard.html
          git diff --staged --quiet || git commit -m "Auto-update tracker database and dashboard"
          if ! git push; then
            # A code push may land while an hourly run is rendering. Rebase the
            # generated snapshot onto that code, then publish once more.
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Pages 배포 설정
        if: steps.freshness.outputs.collect == 'true'
        uses: actions/configure-pages@v4

      - name: index.html 웹 업로드 준비
        if: steps.freshness.outputs.collect == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages 웹 배포
        if: steps.freshness.outputs.collect == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 수집 실패 알림
        if: steps.tracker.outcome == 'failure'
        run: |
          echo "Notion/YouTube collection failed. The last valid dashboard was deployed without replacing its data." >&2
          exit 1
